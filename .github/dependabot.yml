version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      dev-dependencies:
        patterns:
          - "@biomejs/biome"
          - "@types/bun"
          - "typescript"
        # TypeScript 7 是重大版本（原生重写），只允许 minor/patch 自动升级
        update-types:
          - "minor"
          - "patch"
      plugin-sdk:
        patterns:
          - "@opencode-ai/plugin"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
